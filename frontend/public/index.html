<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MF Portfolio Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Header ─────────────────────────────────────────── -->
<header>
  <div class="header-left">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
    </div>
    <div>
      <h1>MF Portfolio <em>Tracker</em></h1>
      <p id="navMeta">Connecting to AMFI…</p>
    </div>
  </div>
  <div class="header-right">
    <div class="stat-pill">
      <span id="totalFundCount">—</span>
      <small>schemes</small>
    </div>
    <div class="stat-pill accent" id="cacheStatus" title="Click to refresh NAV data" style="cursor:pointer;" onclick="refreshData()">
      <span id="cacheIndicator">●</span>
      <small>NAV cache</small>
    </div>
  </div>
</header>

<!-- ── Main Layout ────────────────────────────────────── -->
<main>
  <div class="sidebar">

    <!-- Search -->
    <div class="card search-card">
      <div class="card-label">Add Fund</div>

      <div class="filter-row">
        <select id="filterCategory">
          <option value="all">All Categories</option>
          <option value="equity">Equity</option>
          <option value="debt">Debt</option>
          <option value="hybrid">Hybrid</option>
          <option value="elss">ELSS</option>
          <option value="index">Index</option>
          <option value="liquid">Liquid</option>
          <option value="overnight">Overnight</option>
        </select>
        <select id="filterType">
          <option value="all">All Types</option>
          <option value="direct">Direct</option>
          <option value="regular">Regular</option>
        </select>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input
          type="text"
          id="searchInput"
          placeholder="Search fund name or scheme code…"
          autocomplete="off"
          spellcheck="false"
        >
        <div class="search-spinner" id="searchSpinner"></div>
      </div>

      <div class="suggestion-box" id="suggestionBox">
        <div class="suggestion-header" id="suggestionHeader"></div>
        <div id="suggestionList"></div>
      </div>
    </div>

    <!-- Portfolio summary -->
    <div class="card summary-card" id="summaryCard">
      <div class="card-label">Portfolio Summary</div>
      <div class="summary-total">
        <div class="total-label">Total Value</div>
        <div class="total-value" id="summaryTotal">₹0.00</div>
      </div>
      <div class="summary-stats">
        <div class="s-stat">
          <div class="s-num" id="summaryFunds">0</div>
          <div class="s-lbl">Funds</div>
        </div>
        <div class="s-divider"></div>
        <div class="s-stat">
          <div class="s-num" id="summaryDate">—</div>
          <div class="s-lbl">NAV Date</div>
        </div>
        <div class="s-divider"></div>
        <div class="s-stat">
          <div class="s-num" id="summaryWeighted">—</div>
          <div class="s-lbl">Avg. NAV</div>
        </div>
      </div>
      <div class="summary-actions">
        <button class="btn btn-ghost" onclick="exportCSV()" id="btnExport" disabled>
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
        <button class="btn btn-ghost" onclick="copyPortfolio()" id="btnCopy" disabled>
          <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
        <button class="btn btn-danger" onclick="clearAll()" id="btnClear" disabled>Clear All</button>
      </div>
    </div>

    <!-- AMC Breakdown (shown when funds added) -->
    <div class="card" id="amcBreakdownCard" style="display:none;">
      <div class="card-label">AMC Breakdown</div>
      <div id="amcBreakdown"></div>
    </div>

  </div>

  <!-- Holdings Panel -->
  <div class="holdings-panel">
    <div class="holdings-header">
      <div class="card-label" style="margin:0;">Holdings <span id="holdingCount" class="badge">0</span></div>
      <div class="view-toggle">
        <button class="view-btn active" id="btnGrid" onclick="setView('grid')">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-btn" id="btnList" onclick="setView('list')">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div id="holdingsGrid" class="holdings-grid">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        </div>
        <p>No funds added yet</p>
        <span>Search for a fund on the left to get started</span>
      </div>
    </div>
  </div>
</main>

<!-- ── Toast ──────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
